# Blueprint de Render (https://render.com/docs/blueprint-spec) para desplegar
# la API (FastAPI) + el frontend estático (React). La base de datos es un
# PostgreSQL en Neon (plan gratis sin vencimiento), fuera de Render.
# (el reset nocturno de la demo vive en GitHub Actions, no aquí).
#
# Cómo usarlo:
#   1. Conectar el repo de GitHub en https://dashboard.render.com/blueprints
#      -> "New Blueprint Instance" y elegir este repo.
#   2. Render lee este archivo y crea los 2 servicios de abajo (backend y
#      frontend). El reset nocturno de la demo NO es un
#      cron de Render (los cron jobs de Render no tienen plan gratis, cobran
#      un mínimo de US$1/mes): corre gratis en GitHub Actions, ver
#      .github/workflows/reset-demo.yml.
#   3. SECRET_KEY se genera solo (generateValue) -- nunca vive en este
#      archivo ni en el repo. DATABASE_URL (la connection string de Neon) se
#      carga a mano en el dashboard de Render (`sync: false`), nunca en el repo.
#   4. Render agregó un sufijo a las URLs porque los nombres base ya estaban
#      tomados: el frontend quedó en https://scoreboard-frontend-871z.onrender.com y el backend en
#      https://scoreboard-backend-cy1n.onrender.com. CORS_ORIGINS y VITE_API_URL (abajo) apuntan a esas.
#      Si recreas los servicios, revisa las URLs nuevas y actualízalas aquí.
#
# NOTA: no se pudo probar un despliegue real contra Render desde este
# entorno de desarrollo -- verificá los nombres de campo exactos contra el
# Blueprint spec vigente de Render al momento de usarlo (la sintaxis general
# de `services`/`databases`/`envVars` lleva años estable, pero por si acaso).

services:
  # --- Backend: FastAPI ---
  - type: web
    name: scoreboard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # alembic upgrade head corre ANTES de levantar uvicorn en cada deploy --
    # nunca create_all. Si la migración falla, el deploy falla (no queda un
    # servidor corriendo contra un esquema a medio migrar).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # PostgreSQL en Neon (la base gratis de Render caducaba a los 30 días).
      # sync: false = el valor vive solo en el dashboard de Render.
      - key: DATABASE_URL
        sync: false
      # Generado por Render, único por servicio, nunca en el repo.
      - key: SECRET_KEY
        generateValue: true
      # Render pone la app detrás de su proxy: request.client.host sería la
      # IP interna del proxy para TODO el tráfico. Ver app/core/rate_limit.py.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Ver la nota de arriba sobre por qué esta URL es predecible.
      - key: CORS_ORIGINS
        value: https://scoreboard-frontend-871z.onrender.com
      - key: API_RATE_LIMIT_POR_MINUTO
        value: "60"
      # Notificaciones por email/Slack quedan sin configurar por defecto en
      # este blueprint (son opcionales, ver README) -- agregalas manualmente
      # en el dashboard de Render si querés activarlas: SMTP_HOST,
      # SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM.

  # --- Frontend: React (Vite), servido como sitio estático ---
  - type: web
    name: scoreboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://scoreboard-backend-cy1n.onrender.com
    routes:
      # SPA: cualquier ruta que no sea un archivo real cae en index.html
      # (React Router resuelve /sectores, /criterios, etc. en el cliente).
      - type: rewrite
        source: /*
        destination: /index.html
